; Heltec WiFi LoRa 32 V4.3 (ESP32-S3R2 + SX1262 + KCT8103L PA/FEM)
; See docs/heltec-v4-hardware.md and docs/lora-bringup.md.
[platformio]
default_envs = lora_link

[env]
platform = espressif32
board = heltec_wifi_lora_32_V4
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The boards have 16 MB of flash: two 6.25 MB app slots for over-the-air updates (PlatformIO's default is
; a 4 MB table with 1.25 MB slots, which the Wi-Fi build nearly filled). NVS stays at the same address as
; in the default table, so settings saved there (Wi-Fi network) survive the switch. The partition table is
; only written by a USB upload; see docs/ble-ota.md.
board_build.partitions = default_16MB.csv

; The V4 uses the ESP32-S3 native USB (VID 303a:1001), so Serial is USB-CDC.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/common

lib_deps =
    jgromes/RadioLib@^7
    olikraus/U8g2@^2.36   ; OLED (SSD1315); see docs/oled-display.md

; Ports are intentionally not pinned: two identical boards are attached, so
; choose one with `--upload-port <port>`. See README.md and scripts/ports.sh.

; Both boards run the same bidirectional link test.
[env:lora_link]
build_src_filter = +<lora_link/>

; Identity + SX1262 check + GNSS detection.
[env:smoke]
build_src_filter = +<smoke/>

; lora_link plus a BLE feed of link events, over-the-air updates (BLE, or Wi-Fi once a network has been set up
; from the page) for the phone web app (web/).
[env:lora_link_ble]
extends = env:lora_link
build_flags =
    ${env.build_flags}
    -DLINK_BLE
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.1
    Update   ; framework libraries, used for OTA (src/common/ble_ota.h) and Wi-Fi (src/common/ble_wifi.h)
    WiFi
    HTTPClient
    NetworkClientSecure
    Preferences

; Same test for V4.2 boards (GC1109 PA).
[env:lora_link_v42]
extends = env:lora_link
build_flags =
    ${env.build_flags}
    -DHELTEC_V4_GC1109

; Receive-side LNA enabled (CTX low in RX).
[env:lora_link_lna]
extends = env:lora_link
build_flags =
    ${env.build_flags}
    -DHELTEC_V4_RX_LNA

; Experiments: GNSS module switched off / held in reset (with and without RX LNA).
[env:lora_link_nognss]
extends = env:lora_link
build_flags =
    ${env.build_flags}
    -DHELTEC_V4_GNSS_OFF

[env:lora_link_nognss_lna]
extends = env:lora_link
build_flags =
    ${env.build_flags}
    -DHELTEC_V4_GNSS_OFF
    -DHELTEC_V4_RX_LNA

; Diagnostic: step the front-end control pins in RX only (needs another board running lora_link).
[env:fem_sweep]
build_src_filter = +<fem_sweep/>
