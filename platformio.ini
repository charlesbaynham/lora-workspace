; Heltec WiFi LoRa 32 V4 (ESP32-S3R2 + SX1262 + GC1109 PA/FEM)
[platformio]
default_envs = heltec_v4

[env:heltec_v4]
platform = espressif32
board = heltec_wifi_lora_32_V4
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The V4 uses the ESP32-S3 native USB (VID 303a:1001), so Serial is USB-CDC.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    jgromes/RadioLib@^7

; Ports are intentionally not pinned here: two identical boards are attached,
; so choose one explicitly, e.g. `pio run -t upload --upload-port <port>`.
; See README.md and scripts/ports.sh.
